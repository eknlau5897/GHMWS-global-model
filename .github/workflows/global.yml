name: Auto Generate Model Plots (macOS)

on:
  schedule:
    - cron: '30 8,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-plot:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================================
      # 1. Clear Storage on macOS Runner
      # ==========================================================
      - name: Free Disk Space on macOS
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          
          # Delete heavy SDKs and tools pre-installed on macOS runner
          sudo rm -rf /Library/Developer/CommandLineTools
          sudo rm -rf /Applications/Xcode*.app
          sudo rm -rf /usr/local/Cellar/android-sdk
          sudo rm -rf /usr/local/opt/android-sdk
          
          # Clear Homebrew cache and unwanted formulas
          brew cleanup -s || true
          rm -rf $(brew --cache) || true
          
          echo "=== Disk space after cleanup ==="
          df -h

      # ==========================================================
      # 2. Set up Python & Dependencies
      # ==========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies via Homebrew
        run: |
          brew install geos eccodes

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib cartopy herbie-data xarray cfgrib

      # ==========================================================
      # 3. Run Plot Script & Always Cleanup
      # ==========================================================
      - name: Run Plot Generator Script
        run: |
          python generate_plots.py

      - name: Clean Temporary GRIB Cache
        if: always()
        run: |
          rm -rf ~/data
          echo "Herbie GRIB cache cleared."

      # ==========================================================
      # 4. Commit and Push
      # ==========================================================
      - name: Commit and Push Updated Plots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add plots/*.png
          
          if git diff --staged --quiet; then
            echo "No new changes detected in plot images."
          else
            git commit -m "Auto-update model plots [skip ci]"
            git push
          fi