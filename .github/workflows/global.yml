name: Auto Generate Model Plots (macOS)

on:
  schedule:
    - cron: '0 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-plot:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================================
      # 1. 安全清理 macOS 磁碟空間 (保留 CommandLineTools)
      # ==========================================================
      - name: Safe Free Disk Space on macOS
        run: |
          echo "=== 磁碟清理前狀況 ==="
          df -h
          
          # 只刪除完整的 Xcode App (幾十 GB)，嚴禁刪除 CommandLineTools
          sudo rm -rf /Applications/Xcode*.app
          sudo rm -rf /usr/local/Cellar/android-sdk
          sudo rm -rf /usr/local/opt/android-sdk
          
          # 清理 Homebrew 下載快取
          brew cleanup -s || true
          rm -rf $(brew --cache) || true
          
          echo "=== 磁碟清理後狀況 ==="
          df -h

      # ==========================================================
      # 2. 檢查並補全 Xcode Command Line Tools
      # ==========================================================
      - name: Ensure Xcode Command Line Tools
        run: |
          if ! xcode-select -p >/dev/null 2>&1; then
            echo "Command Line Tools missing, installing..."
            xcode-select --install || true
          fi

      # ==========================================================
      # 3. 設定 Python 環境
      # ==========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ==========================================================
      # 4. 安裝系統依賴 (Cartopy & EcCodes)
      # ==========================================================
      - name: Install System Dependencies via Homebrew
        run: |
          brew update || true
          brew install geos eccodes

      # ==========================================================
      # 5. 安裝 Python 套件
      # ==========================================================
      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib cartopy herbie-data xarray cfgrib

      # ==========================================================
      # 6. 執行 Python 繪圖腳本
      # ==========================================================
      - name: Run Plot Generator Script
        run: |
          python global.py

      # ==========================================================
      # 7. 清理臨時氣象資料快取
      # ==========================================================
      - name: Clean Temporary GRIB Cache
        if: always()
        run: |
          rm -rf ~/data
          echo "Herbie GRIB 快取已清理"

      # ==========================================================
      # 8. 批次 Commit 並 Push (防止超過 1000 個檔案限制)
      # ==========================================================
      - name: Chunked Commit and Push Plots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 每次最多 commit 400 個檔案，分段提交並 push
          CHUNK_SIZE=400
          
          find plots -type f -name "*.png" | xargs -n $CHUNK_SIZE | while read batch; do
            if [ -n "$batch" ]; then
              git add $batch
              if ! git diff --staged --quiet; then
                echo "Committing batch of images..."
                git commit -m "Auto-update model plots batch [skip ci]"
                git pull --rebase
                git push
              fi
            fi
          done