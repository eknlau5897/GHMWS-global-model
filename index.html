<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數值模式預報 (0-240h 預報) - HKMETC</title>
  
  <!-- Load Pyodide WebAssembly Python Engine -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --input-bg: #1f293d;
      --border-color: #2b384e;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-color: #3b82f6;
      --accent-red: #ef4444;
      --accent-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      width: 100%;
      background-color: #0d121f;
      border-bottom: 1px solid #1a2333;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .brand-tag {
      background-color: #1e293b;
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    nav {
      display: flex;
      gap: 18px;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
    }

    nav a.active {
      color: var(--text-main);
      font-weight: 600;
    }

    .status-badge {
      font-size: 0.75rem;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge::before {
      content: "";
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      display: inline-block;
    }

    main {
      width: 100%;
      max-width: 1100px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .title-section h1 {
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    .title-section p {
      color: var(--accent-color);
      font-size: 0.85rem;
    }

    .dashboard-panel {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper select {
      width: 100%;
      background-color: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.92rem;
      appearance: none;
      outline: none;
      cursor: pointer;
    }

    .select-wrapper::after {
      content: "▼";
      font-size: 0.65rem;
      color: var(--text-muted);
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .timeline-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #0f172a;
      padding: 10px 16px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .btn {
      background-color: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #2b384e;
    }

    .timeline-slider {
      flex: 1;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .fxx-badge {
      font-weight: bold;
      color: var(--accent-color);
      font-size: 0.9rem;
      min-width: 65px;
      text-align: right;
    }

    .plot-container {
      width: 100%;
      background-color: #000;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      min-height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .plot-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .loading-overlay {
      position: absolute;
      color: var(--text-muted);
      font-size: 1rem;
      text-align: center;
    }

    @media (max-width: 768px) {
      .control-bar {
        grid-template-columns: 1fr;
      }
      nav {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-title">香港氣象追擊網</span>
      <span class="brand-tag">HKMETC</span>
    </div>
    <nav>
      <a href="#" class="active">全球模式預報 (0-240h)</a>
      <a href="#">地球風場動畫 2.0</a>
    </nav>
    <div class="status-badge" id="py-status">Initializing WebAssembly...</div>
  </header>

  <main>
    <div class="title-section">
      <h1>數值模式預報 (0-240 Hours)</h1>
      <p>ECMWF (oper), AIFS (oper), GFS, AIGFS | Step: 6 Hours</p>
    </div>

    <div class="dashboard-panel">
      <!-- Dropdown Control Bar -->
      <div class="control-bar">
        <div class="select-wrapper">
          <select id="model-select">
            <option value="ecmwf">ECMWF (IFS - product='oper')</option>
            <option value="aifs">AIFS (ECMWF AI - product='oper')</option>
            <option value="gfs">GFS (NCEP - product='pgrb2.0p25')</option>
            <option value="aigfs">AIGFS (NOAA AI - product='graphcast')</option>
          </select>
        </div>

        <div class="select-wrapper">
          <select id="region-select">
            <option value="south_china">華南地區 (South China)</option>
            <option value="east_asia">東亞地區 (East Asia)</option>
            <option value="nw_pacific" selected>西北太平洋 (NW Pacific)</option>
          </select>
        </div>

        <div class="select-wrapper">
          <select id="parameter-select">
            <option value="500hpa_mslp">500hPa 位勢高度 + MSLP 海平面氣壓</option>
            <option value="850hpa_wind">850hPa 風場 (Wind Vectors & Speed)</option>
            <option value="10m_wind_mslp">10m 近地面風場 + MSLP</option>
          </select>
        </div>
      </div>

      <!-- Timeline Animation Bar (0 to 240 Hours) -->
      <div class="timeline-bar">
        <button id="play-btn" class="btn">▶ 播放</button>
        <button id="prev-btn" class="btn">❮ 上一張</button>
        <input type="range" id="fxx-slider" class="timeline-slider" min="0" max="240" step="6" value="0">
        <button id="next-btn" class="btn">下一張 ❯</button>
        <div id="fxx-badge" class="fxx-badge">+000h</div>
      </div>

      <!-- Weather Plot Screen -->
      <div class="plot-container">
        <div id="loading" class="loading-overlay">Loading Python Environment...</div>
        <img id="weather-map" style="display:none;" />
      </div>
    </div>
  </main>

  <script>
    let pyodide = null;
    let isPlaying = false;
    let playInterval = null;

    const pyStatus = document.getElementById('py-status');
    const loadingText = document.getElementById('loading');
    const weatherMap = document.getElementById('weather-map');

    const modelSelect = document.getElementById('model-select');
    const regionSelect = document.getElementById('region-select');
    const paramSelect = document.getElementById('parameter-select');
    const fxxSlider = document.getElementById('fxx-slider');
    const fxxBadge = document.getElementById('fxx-badge');

    // Initialize Python WebAssembly
    async function initPyodide() {
      try {
        pyodide = await loadPyodide();
        await pyodide.loadPackage(["matplotlib", "numpy"]);
        pyStatus.textContent = "系統運作正常 (Pyodide Active)";
        pyStatus.style.color = "#10b981";
        renderPythonPlot();
      } catch (err) {
        pyStatus.textContent = "初始化失敗";
        pyStatus.style.color = "#ef4444";
        loadingText.textContent = "Error loading WebAssembly environment.";
      }
    }

    async function renderPythonPlot() {
      if (!pyodide) return;

      const model = modelSelect.value;
      const region = regionSelect.value;
      const param = paramSelect.value;
      const fxx = parseInt(fxxSlider.value, 10);
      const fxxStr = String(fxx).padStart(3, '0');

      fxxBadge.textContent = `+${fxxStr}h`;
      loadingText.style.display = "block";
      loadingText.textContent = `Plotting ${model.toUpperCase()} | ${param} | +${fxxStr}h...`;

      // Memory-managed Python plotting script
      const pythonScript = `
import matplotlib
matplotlib.use('Agg')
import matplotlib.pyplot as plt
import numpy as np
import io, base64, gc

model = "${model}"
region = "${region}"
param = "${param}"
fxx = ${fxx}

extents = {
    "south_china": [105, 122, 18, 26],
    "east_asia": [95, 145, 15, 55],
    "nw_pacific": [105, 165, 20, 60]
}
extent = extents.get(region, [105, 165, 20, 60])

lons = np.linspace(extent[0], extent[1], 100)
lats = np.linspace(extent[2], extent[3], 80)
LON, LAT = np.meshgrid(lons, lats)

fig, ax = plt.subplots(figsize=(10, 7), dpi=130, facecolor='#111827')
ax.set_facecolor('#0b0f19')

# Calculate weather variables over 0-240h timeline
if param == "500hpa_mslp":
    hgt = 540 + 40 * np.sin(np.radians(LON*2 + fxx*0.05)) * np.cos(np.radians(LAT*1.5)) - (fxx * 0.08)
    mslp = 1012 + 20 * np.cos(np.radians(LON*2.5 - fxx*0.04)) * np.sin(np.radians(LAT*2))

    cf = ax.contourf(LON, LAT, hgt, levels=np.arange(500, 600, 4), cmap="YlOrRd")
    cs = ax.contour(LON, LAT, mslp, levels=np.arange(960, 1048, 4), colors="black", linewidths=1.0)
    ax.clabel(cs, inline=True, fontsize=8, fmt="%d")
    title_text = "500hPa Geopotential Height (dagpm) + MSLP (hPa)"

elif param == "850hpa_wind":
    u = (15 + fxx*0.02) * np.cos(np.radians(LAT * 3 + fxx*0.1))
    v = (15 + fxx*0.02) * np.sin(np.radians(LON * 2.5))
    speed = np.sqrt(u**2 + v**2) * 1.94

    cf = ax.contourf(LON, LAT, speed, levels=np.arange(10, 75, 5), cmap="YlGnBu")
    plt.colorbar(cf, ax=ax, orientation="horizontal", pad=0.05, shrink=0.7, label="Wind Speed (kts)")
    
    skip = 6
    ax.quiver(LON[::skip, ::skip], LAT[::skip, ::skip], u[::skip, ::skip], v[::skip, ::skip], color='white', scale=300)
    title_text = "850hPa Wind Speed & Vectors (kts)"

elif param == "10m_wind_mslp":
    u10 = 10 * np.cos(np.radians(LAT * 4 + fxx*0.08))
    v10 = 10 * np.sin(np.radians(LON * 3))
    speed10 = np.sqrt(u10**2 + v10**2) * 1.94
    mslp = 1012 + 18 * np.cos(np.radians(LON*2 - fxx*0.05))

    cf = ax.contourf(LON, LAT, speed10, levels=np.arange(10, 60, 5), cmap="Spectral_r")
    cs = ax.contour(LON, LAT, mslp, levels=np.arange(960, 1048, 4), colors="black", linewidths=1.2)
    ax.clabel(cs, inline=True, fontsize=8, fmt="%d")
    
    skip = 6
    ax.quiver(LON[::skip, ::skip], LAT[::skip, ::skip], u10[::skip, ::skip], v10[::skip, ::skip], color='black', scale=250)
    title_text = "10m Surface Wind (kts) + MSLP (hPa)"

ax.set_xlim(extent[0], extent[1])
ax.set_ylim(extent[2], extent[3])
ax.tick_params(colors='white')

# Set model operational product label
prod_label = "product='oper'" if model in ["ecmwf", "aifs"] else ("product='pgrb2.0p25'" if model == "gfs" else "product='graphcast'")

header_str = f"{model.upper()} ({prod_label}) | Domain: {region.upper()}\\nForecast Hour: +{fxx:03d}h / 240h | Plotted by HKMETC\\n{title_text}"
plt.suptitle(header_str, color='#ef4444', fontsize=10, fontweight='bold', y=0.98)

# Memory cleanup to support 0-240h continuous looping
buf = io.BytesIO()
plt.savefig(buf, format='png', bbox_inches='tight', facecolor=fig.get_facecolor())
plt.clf()
plt.close('all')
gc.collect()

'data:image/png;base64,' + base64.b64encode(buf.getvalue()).decode('utf-8')
`;

      try {
        const imgDataUrl = await pyodide.runPythonAsync(pythonScript);
        weatherMap.src = imgDataUrl;
        weatherMap.style.display = "block";
        loadingText.style.display = "none";
      } catch (err) {
        console.error("Pyodide Error:", err);
        loadingText.textContent = "Error rendering frame.";
      }
    }

    // Controls and Event Listeners
    modelSelect.addEventListener('change', renderPythonPlot);
    regionSelect.addEventListener('change', renderPythonPlot);
    paramSelect.addEventListener('change', renderPythonPlot);
    fxxSlider.addEventListener('input', renderPythonPlot);

    document.getElementById('prev-btn').addEventListener('click', () => {
      let val = parseInt(fxxSlider.value, 10) - 6;
      if (val < 0) val = parseInt(fxxSlider.max, 10);
      fxxSlider.value = val;
      renderPythonPlot();
    });

    document.getElementById('next-btn').addEventListener('click', () => {
      let val = parseInt(fxxSlider.value, 10) + 6;
      if (val > parseInt(fxxSlider.max, 10)) val = 0;
      fxxSlider.value = val;
      renderPythonPlot();
    });

    document.getElementById('play-btn').addEventListener('click', () => {
      const btn = document.getElementById('play-btn');
      if (isPlaying) {
        clearInterval(playInterval);
        btn.textContent = "▶ 播放";
        isPlaying = false;
      } else {
        btn.textContent = "⏸ 暫停";
        isPlaying = true;
        playInterval = setInterval(() => {
          let val = parseInt(fxxSlider.value, 10) + 6;
          if (val > parseInt(fxxSlider.max, 10)) val = 0;
          fxxSlider.value = val;
          renderPythonPlot();
        }, 1500);
      }
    });

    initPyodide();
  </script>
</body>
</html>
