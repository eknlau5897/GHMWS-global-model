<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數值模式預報 (Client-Side Pyodide Plotter) - HKMETC</title>
  
  <!-- Load Pyodide WebAssembly Python Engine -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --input-bg: #1f293d;
      --border-color: #2b384e;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-color: #3b82f6;
      --accent-red: #ef4444;
      --accent-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      width: 100%;
      background-color: #0d121f;
      border-bottom: 1px solid #1a2333;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .brand-tag {
      background-color: #1e293b;
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    nav {
      display: flex;
      gap: 18px;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
    }

    nav a.active {
      color: var(--text-main);
      font-weight: 600;
    }

    .status-badge {
      font-size: 0.75rem;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge::before {
      content: "";
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      display: inline-block;
    }

    main {
      width: 100%;
      max-width: 1100px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .title-section h1 {
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    .title-section p {
      color: var(--accent-color);
      font-size: 0.85rem;
    }

    .dashboard-panel {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper select {
      width: 100%;
      background-color: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.92rem;
      appearance: none;
      outline: none;
    }

    .select-wrapper::after {
      content: "▼";
      font-size: 0.65rem;
      color: var(--text-muted);
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .timeline-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #0f172a;
      padding: 10px 16px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .btn {
      background-color: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .timeline-slider {
      flex: 1;
      accent-color: var(--accent-color);
    }

    .fxx-badge {
      font-weight: bold;
      color: var(--accent-color);
      font-size: 0.9rem;
      min-width: 50px;
      text-align: right;
    }

    .plot-container {
      width: 100%;
      background-color: #000;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      min-height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .plot-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .loading-overlay {
      position: absolute;
      color: var(--text-muted);
      font-size: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-title">香港氣象追擊網</span>
      <span class="brand-tag">HKMETC</span>
    </div>
    <nav>
      <a href="#" class="active">全球模式預報</a>
      <a href="#">地球風場動畫 2.0</a>
    </nav>
    <div class="status-badge" id="py-status">Initializing Python...</div>
  </header>

  <main>
    <div class="title-section">
      <h1>數值模式預報 (Pyodide Engine)</h1>
      <p>In-Browser Python Matplotlib Plotter</p>
    </div>

    <div class="dashboard-panel">
      <div class="control-bar">
        <div class="select-wrapper">
            <select id="model-select">
                <option value="ecmwf">ECMWF (IFS - product='oper')</option>
                <option value="aifs">AIFS (ECMWF AI - product='oper')</option>
                <option value="gfs">GFS (NCEP - product='pgrb2.0p25')</option>
                <option value="aigfs">AIGFS (NOAA AI - product='graphcast')</option>
            </select>
        </div>

        <div class="select-wrapper">
          <select id="region-select">
            <option value="south_china">華南地區 (South China)</option>
            <option value="east_asia">東亞地區 (East Asia)</option>
            <option value="nw_pacific" selected>西北太平洋 (NW Pacific)</option>
          </select>
        </div>

        <div class="select-wrapper">
          <select id="parameter-select">
            <option value="500hpa_mslp">500hPa 位勢高度 + MSLP 海平面氣壓</option>
            <option value="850hpa_wind">850hPa 風場 (Wind Vectors & Speed)</option>
            <option value="10m_wind_mslp">10m 風場 + MSLP 海平面氣壓</option>
          </select>
        </div>
      </div>

      <div class="timeline-bar">
        <button id="play-btn" class="btn">▶ 播放</button>
        <button id="prev-btn" class="btn">❮ 上一張</button>
        <input type="range" id="fxx-slider" class="timeline-slider" min="0" max="72" step="6" value="0">
        <button id="next-btn" class="btn">下一張 ❯</button>
        <div id="fxx-badge" class="fxx-badge">+00h</div>
      </div>

      <div class="plot-container">
        <div id="loading" class="loading-overlay">Loading WebAssembly Python Engine...</div>
        <img id="weather-map" style="display:none;" />
      </div>
    </div>
  </main>

  <script>
    let pyodide = null;
    let isPlaying = false;
    let playInterval = null;

    const pyStatus = document.getElementById('py-status');
    const loadingText = document.getElementById('loading');
    const weatherMap = document.getElementById('weather-map');

    const modelSelect = document.getElementById('model-select');
    const regionSelect = document.getElementById('region-select');
    const paramSelect = document.getElementById('parameter-select');
    const fxxSlider = document.getElementById('fxx-slider');
    const fxxBadge = document.getElementById('fxx-badge');

    // Load Pyodide WebAssembly runtime
    async function initPyodide() {
      pyodide = await loadPyodide();
      await pyodide.loadPackage(["matplotlib", "numpy"]);
      pyStatus.textContent = "系統運作正常 (Pyodide Active)";
      pyStatus.style.color = "#10b981";
      renderPythonPlot();
    }

    async function renderPythonPlot() {
      if (!pyodide) return;

      const model = modelSelect.value;
      const region = regionSelect.value;
      const param = paramSelect.value;
      const fxx = parseInt(fxxSlider.value, 10);
      const fxxStr = String(fxx).padStart(2, '0');

      fxxBadge.textContent = `+${fxxStr}h`;
      loadingText.style.display = "block";
      loadingText.textContent = `Plotting ${model} | ${param} | +${fxxStr}h...`;

      // Python execution script producing all 3 plot variants
      const pythonScript = `
import os
import datetime
import numpy as np
import matplotlib.pyplot as plt
import cartopy.crs as ccrs
import cartopy.feature as cfeature
from herbie import Herbie

PLOTS_DIR = "plots"
os.makedirs(PLOTS_DIR, exist_ok=True)

CYCLE_DATE = (datetime.datetime.utcnow() - datetime.timedelta(days=1)).strftime("%Y-%m-%d 12:00")

DOMAINS = {
    "south_china": [105, 122, 18, 26],
    "east_asia": [95, 145, 15, 55],
    "nw_pacific": [105, 165, 20, 60]
}

def create_base_map(domain_key):
    fig = plt.figure(figsize=(12, 9), dpi=150)
    ax = plt.axes(projection=ccrs.PlateCarree())
    ax.set_extent(DOMAINS[domain_key], crs=ccrs.PlateCarree())

    scale = "10m" if domain_key == "south_china" else "50m"
    ax.add_feature(cfeature.COASTLINE.with_scale(scale), linewidth=0.8, edgecolor="black")
    ax.add_feature(cfeature.BORDERS.with_scale(scale), linewidth=0.5, edgecolor="black")

    gl = ax.gridlines(draw_labels=True, linewidth=0.3, color='gray', alpha=0.5, linestyle='--')
    gl.top_labels, gl.right_labels = False, True
    return fig, ax

def fetch_herbie_ds(model, fxx, search_pattern):
    """Dynamically sets model and product for Herbie."""
    model_lower = model.lower()
    
    # Configure model and product parameters correctly
    if model_lower == "gfs":
        product = "pgrb2.0p25"
    elif model_lower == "aigfs":
        product = "graphcast"
    elif model_lower in ["ecmwf", "aifs"]:
        product = "oper"  # ECMWF Open Data uses 'oper' for operational runs
    else:
        product = "oper"

    H = Herbie(CYCLE_DATE, model=model_lower, product=product, fxx=fxx)
    return H.xarray(search_pattern)

# --- 1. 500hPa HGT + MSLP ---
def plot_500hpa_mslp(model="ecmwf", domain_key="nw_pacific", fxx=0):
    m_lower = model.lower()
    hgt_pat = ":HGT:500 mb:" if m_lower in ["gfs", "aigfs"] else ":gh:500:"
    mslp_pat = ":PRMSL:mean sea level:" if m_lower in ["gfs", "aigfs"] else ":msl:"

    ds_hgt = fetch_herbie_ds(model, fxx, hgt_pat)
    ds_mslp = fetch_herbie_ds(model, fxx, mslp_pat)

    lons, lats = ds_hgt.longitude.values, ds_hgt.latitude.values
    
    # Standardize units (Height to dagpm, MSLP to hPa)
    hgt_val = ds_hgt[list(ds_hgt.data_vars)[0]].values
    hgt_dagpm = hgt_val / 10.0 if np.mean(hgt_val) > 1000 else hgt_val

    mslp_val = ds_mslp[list(ds_mslp.data_vars)[0]].values
    mslp_hpa = mslp_val / 100.0 if np.mean(mslp_val) > 2000 else mslp_val

    fig, ax = create_base_map(domain_key)
    ax.contourf(lons, lats, hgt_dagpm, levels=np.arange(500, 600, 4), cmap="YlOrRd", transform=ccrs.PlateCarree())
    cs = ax.contour(lons, lats, mslp_hpa, levels=np.arange(960, 1048, 4), colors="black", linewidths=1.0, transform=ccrs.PlateCarree())
    ax.clabel(cs, inline=True, fontsize=8, fmt="%d")

    plt.title(f"{model.upper()} (product='oper') | 500hPa HGT + MSLP | {domain_key.upper()} | +{fxx:02d}h", fontsize=11, color="#b91c1c", fontweight="bold")
    plt.savefig(f"{PLOTS_DIR}/{m_lower}_500hpa_mslp_{domain_key}_f{fxx:02d}.png", bbox_inches="tight")
    plt.close()

# --- 2. 850hPa Wind ---
def plot_850hpa_wind(model="ecmwf", domain_key="nw_pacific", fxx=0):
    m_lower = model.lower()
    u_pat = ":UGRD:850 mb:" if m_lower in ["gfs", "aigfs"] else ":u:850:"
    v_pat = ":VGRD:850 mb:" if m_lower in ["gfs", "aigfs"] else ":v:850:"

    ds_u = fetch_herbie_ds(model, fxx, u_pat)
    ds_v = fetch_herbie_ds(model, fxx, v_pat)

    lons, lats = ds_u.longitude.values, ds_u.latitude.values
    u, v = ds_u[list(ds_u.data_vars)[0]].values, ds_v[list(ds_v.data_vars)[0]].values
    wind_kts = np.sqrt(u**2 + v**2) * 1.94384

    fig, ax = create_base_map(domain_key)
    cf = ax.contourf(lons, lats, wind_kts, levels=np.arange(10, 75, 5), cmap="YlGnBu", transform=ccrs.PlateCarree())
    plt.colorbar(cf, ax=ax, orientation="horizontal", pad=0.04, shrink=0.7, label="850hPa Wind Speed (kts)")

    skip = 3 if domain_key == "south_china" else 6
    ax.barbs(lons[::skip], lats[::skip], u[::skip, ::skip], v[::skip, ::skip], length=5, transform=ccrs.PlateCarree())

    plt.title(f"{model.upper()} (product='oper') | 850hPa Wind Vectors | {domain_key.upper()} | +{fxx:02d}h", fontsize=11, fontweight="bold")
    plt.savefig(f"{PLOTS_DIR}/{m_lower}_850hpa_wind_{domain_key}_f{fxx:02d}.png", bbox_inches="tight")
    plt.close()

# --- 3. 10m Wind + MSLP ---
def plot_10m_wind_mslp(model="ecmwf", domain_key="nw_pacific", fxx=0):
    m_lower = model.lower()
    u10_pat = ":UGRD:10 m above ground:" if m_lower in ["gfs", "aigfs"] else ":10u:"
    v10_pat = ":VGRD:10 m above ground:" if m_lower in ["gfs", "aigfs"] else ":10v:"
    mslp_pat = ":PRMSL:mean sea level:" if m_lower in ["gfs", "aigfs"] else ":msl:"

    ds_u10 = fetch_herbie_ds(model, fxx, u10_pat)
    ds_v10 = fetch_herbie_ds(model, fxx, v10_pat)
    ds_mslp = fetch_herbie_ds(model, fxx, mslp_pat)

    lons, lats = ds_u10.longitude.values, ds_u10.latitude.values
    u10, v10 = ds_u10[list(ds_u10.data_vars)[0]].values, ds_v10[list(ds_v10.data_vars)[0]].values
    
    mslp_val = ds_mslp[list(ds_mslp.data_vars)[0]].values
    mslp_hpa = mslp_val / 100.0 if np.mean(mslp_val) > 2000 else mslp_val
    wind10_kts = np.sqrt(u10**2 + v10**2) * 1.94384

    fig, ax = create_base_map(domain_key)
    cf = ax.contourf(lons, lats, wind10_kts, levels=np.arange(10, 65, 5), cmap="Spectral_r", transform=ccrs.PlateCarree())
    plt.colorbar(cf, ax=ax, orientation="horizontal", pad=0.04, shrink=0.7, label="10m Wind Speed (kts)")

    cs = ax.contour(lons, lats, mslp_hpa, levels=np.arange(960, 1048, 4), colors="black", linewidths=1.2, transform=ccrs.PlateCarree())
    ax.clabel(cs, inline=True, fontsize=8, fmt="%d")

    skip = 3 if domain_key == "south_china" else 6
    ax.barbs(lons[::skip], lats[::skip], u10[::skip, ::skip], v10[::skip, ::skip], length=4.5, transform=ccrs.PlateCarree())

    plt.title(f"{model.upper()} (product='oper') | 10m Wind + MSLP | {domain_key.upper()} | +{fxx:02d}h", fontsize=11, fontweight="bold")
    plt.savefig(f"{PLOTS_DIR}/{m_lower}_10m_wind_mslp_{domain_key}_f{fxx:02d}.png", bbox_inches="tight")
    plt.close()

if __name__ == "__main__":
    MODELS = ["ecmwf", "aifs", "gfs", "aigfs"]
    DOMAINS_TO_RUN = ["south_china", "east_asia", "nw_pacific"]
    FORECAST_HOURS = [0, 6, 12, 18, 24, 48, 72]

    for model in MODELS:
        for domain in DOMAINS_TO_RUN:
            for fxx in FORECAST_HOURS:
                try:
                    plot_500hpa_mslp(model=model, domain_key=domain, fxx=fxx)
                    plot_850hpa_wind(model=model, domain_key=domain, fxx=fxx)
                    plot_10m_wind_mslp(model=model, domain_key=domain, fxx=fxx)
                except Exception as e:
                    print(f"Error {model} {domain} f{fxx}: {e}")
`;

      const imgDataUrl = await pyodide.runPythonAsync(pythonScript);
      weatherMap.src = imgDataUrl;
      weatherMap.style.display = "block";
      loadingText.style.display = "none";
    }

    // Event listeners
    modelSelect.addEventListener('change', renderPythonPlot);
    regionSelect.addEventListener('change', renderPythonPlot);
    paramSelect.addEventListener('change', renderPythonPlot);
    fxxSlider.addEventListener('input', renderPythonPlot);

    document.getElementById('prev-btn').addEventListener('click', () => {
      let val = parseInt(fxxSlider.value, 10) - 6;
      if (val < 0) val = parseInt(fxxSlider.max, 10);
      fxxSlider.value = val;
      renderPythonPlot();
    });

    document.getElementById('next-btn').addEventListener('click', () => {
      let val = parseInt(fxxSlider.value, 10) + 6;
      if (val > parseInt(fxxSlider.max, 10)) val = 0;
      fxxSlider.value = val;
      renderPythonPlot();
    });

    document.getElementById('play-btn').addEventListener('click', () => {
      const btn = document.getElementById('play-btn');
      if (isPlaying) {
        clearInterval(playInterval);
        btn.textContent = "▶ 播放";
        isPlaying = false;
      } else {
        btn.textContent = "⏸ 暫停";
        isPlaying = true;
        playInterval = setInterval(() => {
          let val = parseInt(fxxSlider.value, 10) + 6;
          if (val > parseInt(fxxSlider.max, 10)) val = 0;
          fxxSlider.value = val;
          renderPythonPlot();
        }, 2000);
      }
    });

    initPyodide();
  </script>
</body>
</html>
